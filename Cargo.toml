[package]
name = "onecoat"
version = "0.1.0"
edition = "2024"
description = "Apply one canonical theme to Windows Terminal, Herdr, and the omp harness"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
jsonc-parser = { version = "0.33", features = ["cst", "serde_json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.1"

[dev-dependencies]
jsonschema = "0.58"
tempfile = "3"
